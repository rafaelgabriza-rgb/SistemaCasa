      <li>
        <a href="../templates/seguranca.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>

    </ul>

    <div class="rodape">Casa do Rafael</div>
  </nav>

  <!-- CONTEÚDO -->
  <main class="conteudo-principal">

    <header class="pagina-topo">
      <h1 class="pagina-titulo">Temperatura</h1>
      <p class="resumo" id="resumo" aria-live="polite">Ative o JavaScript para controlar o ar-condicionado.</p>
    </header>

    <div class="painel">

      <!-- Termostato -->
      <section class="termostato" id="termostato" data-modo="frio" data-ligado="true" aria-label="Termostato da casa">
        <div class="termostato-topo">
          <h2>Ar-condicionado</h2>
          <button type="button" class="interruptor" id="power" role="switch" aria-checked="true" aria-label="Sistema ligado"></button>
        </div>

        <div class="dial">
          <svg viewBox="0 0 220 220" aria-hidden="true">
            <g transform="rotate(135 110 110)" fill="none" stroke-width="14" stroke-linecap="round">
              <circle class="trilho" id="trilho" cx="110" cy="110" r="88"/>
              <circle class="arco" id="arco" cx="110" cy="110" r="88" stroke-dasharray="0.001 553"/>
            </g>
          </svg>
          <div class="dial-centro">
            <div class="dial-valor" id="dial-valor">23<small>°C</small></div>
            <div class="dial-legenda" id="dial-legenda"></div>
            <div class="dial-agora" id="dial-agora"></div>
          </div>
        </div>

        <div class="ajuste">
          <button type="button" id="menos" aria-label="Baixar 1 grau">&minus;</button>
          <button type="button" id="mais" aria-label="Subir 1 grau">+</button>
        </div>

        <fieldset class="grupo">
          <legend>Modo</legend>
          <div class="opcoes">
            <button type="button" class="opcao" data-modo="frio" aria-pressed="true">Resfriar</button>
            <button type="button" class="opcao" data-modo="calor" aria-pressed="false">Aquecer</button>
            <button type="button" class="opcao" data-modo="vento" aria-pressed="false">Ventilar</button>
          </div>
        </fieldset>

        <fieldset class="grupo">
          <legend>Ventilador</legend>
          <div class="opcoes">
            <button type="button" class="opcao" data-vento="baixa" aria-pressed="false">Baixo</button>
            <button type="button" class="opcao" data-vento="media" aria-pressed="true">Médio</button>
            <button type="button" class="opcao" data-vento="alta" aria-pressed="false">Alto</button>
          </div>
        </fieldset>
      </section>

      <!-- Cômodos -->
      <section aria-labelledby="comodos-titulo">
        <h2 class="comodos-titulo" id="comodos-titulo">Cômodos</h2>
        <p class="comodos-sub">Ligue o ar só onde precisa.</p>
        <div class="comodos" id="comodos"></div>
        <p class="externa">Lá fora: 29°C (valor simulado).</p>
      </section>

    </div>
  </main>

</body>
</html>
